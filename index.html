    <main id="pratoDia">
        <h2>Prato do Dia</h2>
        <figure>
            <img src="assets/tortellini.webp" alt="Prato Tortellini Três Queijos" />
            <figcaption><h2>Tortellini Três Queijos</h2>
            <p>Nosso prato do dia é aquela massa caprichada com o toque mágico dos Três Queijos (Brie, Parmeggiano e Mozzarella di Bufala). Uma combinação cremosa, rica em sabor e com a textura perfeita para quem aprecia uma refeição memorável.<br/>
                Feita com ingredientes selecionados e finalizada com um leve toque de manteiga e ervas frescas, essa massa promete uma experiência que conforta, encanta e surpreende a cada garfada.
                Experimente hoje mesmo e sinta o sabor que faz a diferença.<br/>
                Perfeito para o almoço, para renovar as energias, ou para um jantar especial. Bon appétit! 🍝✨
            </p></figcaption>
        </figure>
    </main>
